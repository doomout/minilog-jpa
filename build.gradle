
// 프로젝트 빌드 과정에서 그래들이 사용할 플러그인을 설정합니다.
plugins {
	// 컴파일, 테스트, 패키징, 실행들을 java
	id 'java'

	// 스프링 부트의 의존성 관리 및 패키징, 자동설정, 실행 관련 태스크 제공
	id 'org.springframework.boot' version '3.3.1'

	// 스프링 의존성 관리 기능 제공
	id 'io.spring.dependency-management' version '1.1.7'

	// 다양한 언어를 위한 코드 포매터와 태스크 제공
	id 'com.diffplug.spotless' version '6.25.0'
}

// 프로젝트 그룹 ID와 버전을 설정
group = 'com.asdf'
version = '0.0.1-dev'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

// 프로젝트 의존성을 해결하기 위한 Maven 센트롤 저장소를 추가
repositories {
	mavenCentral()
}

// 프로젝트의 구현, 테스트, 런타임 의존성을 설정
// 여기에 필요한 의존성을 추가하면, 그래이들이 자동으로 의존성을 mavenCentral 을 통해 다운로드합니다.
dependencies {
	// spring boot web 스타터 의존성을 추가
	implementation 'org.springframework.boot:spring-boot-starter-web'

	// Swagger UI를 사용하기 위한 의존성을 추가
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'

	// Spring Data JPA 스타터 의존성을 추가
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

	// Mysql JDBC 드라이버 의존성 추가
	implementation 'mysql:mysql-connector-java:8.0.32'

	// Spring Security 와 JWT 의존성 추가
	implementation 'org.springframework.boot:spring-boot-starter-security'

	// JWT 라이브러리를 추가
	implementation 'io.jsonwebtoken:jjwt-api:0.11.5'

	// Lombok 라이브러리 설정 (Getter, Setter 등을 자동으로 생성)
	compileOnly 'org.projectlombok:lombok'

	// Lombok 이 제공하는 기능을 사용하기 위한 애노테이션 프로세서를 추가
	annotationProcessor 'org.projectlombok:lombok'

	// JUnit 5 를 이용한 테스트를 위한 의존성 추가
	testImplementation 'org.springframework.boot:spring-boot-starter-test'

	// Spring Security 테스트를 위한 의존성 추가
	testImplementation 'org.springframework.security:spring-security-test'

	// 임시 MySQL 컨테이너를 생성하여 유닛 테스트 수행을 하기 위한 의존성 추가
	testImplementation 'org.testcontainers:junit-jupiter:1.20.1'
	testImplementation 'org.testcontainers:testcontainers:1.20.1'
	testImplementation 'org.testcontainers:mysql:1.20.1'

	// JUnit 5 테스트를 실행하기 위한 런타임 의존성을 추가
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	// JWT 라이브러리의 구현체를 추가
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

	// GraphQL 의존성 추가
	implementation 'org.springframework.boot:spring-boot-starter-graphql'
	implementation 'com.graphql-java-kickstart:graphql-java-tools:11.1.0'
	implementation 'com.graphql-java-kickstart:graphiql-spring-boot-starter:11.1.0'
	implementation 'com.graphql-java:graphql-java:22.0'
	implementation 'com.graphql-java:graphql-java-extended-scalars:22.0'

	testImplementation 'org.springframework.graphql:spring-graphql-test'
}

// 테스트 태스크를 구성
tasks.named('test') {
	useJUnitPlatform()

	// 테스트 실행시 상세한 결과 출력 활성화
	testLogging {
		// 테스트 이벤트 중 어떤 것을 로그로 출력할지 설정
		events "passed", "skipped", "failed"

		// 테스트 케이스 별 결과를 항상 출력하도록 설정
		outputs.upToDateWhen { false }

		// Java Agent 경고 메세지 억제
		jvmArgs '-XX:+EnableDynamicAgentLoading'
	}
}

// Spotless 플러그인을 사용하여 코드 양식을 자동으로 맞춰줍니다.
spotless {
	// Java 파일에 대한 포맷팅 설정을 추가
	java {
		// Google Java Format 적용
		googleJavaFormat('1.22.0').aosp().reflowLongStrings()
	}
}

// build 할 때 spotlessApply 를 실행하여 자동으로 코드의 양식을 맞춥니다.
build.dependsOn 'spotlessApply'
