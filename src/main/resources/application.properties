# 애플리케이션 이름 설정
spring.application.name=minilog-mysql

# 데이터베이스 URL 설정
spring.datasource.url=jdbc:mysql://localhost:3307/minilog_db

# db 사용자 이름
spring.datasource.username=minilog_user

# DB 암호
spring.datasource.password=dev_password

# JDBC 드라이버를 사용
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 스키마를 자동으로 업데이트 하도록 설정
spring.jpa.hibernate.ddl-auto=update

# SQL 쿼리를 출력하도록 설정
spring.jpa.show-sql=true
